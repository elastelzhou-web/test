name: Verify v2ray manager
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  linux:
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
      - name: Fetch exact source commit
        env:
          SOURCE_SHA: '${{ github.sha }}'
        run: |
          git init .
          git remote add origin https://github.com/elastelzhou-web/test.git
          git fetch --depth=1 origin "$SOURCE_SHA"
          git checkout --detach FETCH_HEAD
      - name: Syntax, legacy regressions, manager serialization, and QR generation
        run: |
          bash -n install.sh tests/*.sh
          bash tests/test.sh
          bash tests/manager.sh
          bash tests/share.sh
          python3 - <<'PY'
          import hashlib,json
          m=json.load(open('manifest.json'))
          assert hashlib.sha256(open('install.sh','rb').read()).hexdigest()==m['sha256']
          PY
      - name: Actual REALITY and Shadowsocks TCP/UDP proxy tests
        run: bash tests/network.sh
      - name: QR decoding dependencies for independent verification
        run: |
          sudo apt-get -qq update
          sudo apt-get -qq install -y librsvg2-bin zbar-tools
      - name: All management commands, safe rollback, HTTPS links, updates and v2 migration
        run: sudo bash tests/commands.sh
  centos7:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - name: Fetch exact source commit
        env:
          SOURCE_SHA: '${{ github.sha }}'
        run: |
          git init .
          git remote add origin https://github.com/elastelzhou-web/test.git
          git fetch --depth=1 origin "$SOURCE_SHA"
          git checkout --detach FETCH_HEAD
      - name: Bash 4.2 / Python 2.7 manager, QR and real REALITY/SS traffic
        run: |
          docker run --rm -v "$PWD:/repo:ro" -w /repo quay.io/centos/centos:7 \
            bash -c 'bash tests/test.sh && bash tests/manager.sh && bash tests/share.sh && bash tests/network.sh'
